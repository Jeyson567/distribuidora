<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Pausado</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .error-icon {
      width: 90px;
      height: 90px;
      margin: 0 auto 28px;
      border: 3px solid #ff3b30;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: bold;
      color: #ff3b30;
      box-shadow: 0 0 30px rgba(255, 59, 48, 0.25);
    }

    .error {
      color: #ff3b30;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(30px, 7vw, 46px);
      margin-bottom: 18px;
      font-weight: 700;
    }

    .message {
      color: #aaa;
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .payment {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 30px;
      background: #151515;
      border: 1px solid #292929;
      color: #ccc;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .whatsapp {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 17px 25px;
      border: none;
      border-radius: 12px;
      background: #25D366;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s ease;
      box-shadow: 0 8px 25px rgba(37, 211, 102, 0.2);
    }

    .whatsapp:hover {
      background: #20bd5a;
      transform: translateY(-2px);
    }

    .whatsapp-icon {
      width: 25px;
      height: 25px;
      fill: white;
    }

    .footer {
      margin-top: 25px;
      color: #555;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="error-icon">!</div>

    <div class="error">ERROR DEL SISTEMA</div>

    <h1>Sistema pausado</h1>

    <p class="message">
      El acceso al sistema ha sido temporalmente suspendido
      debido a falta de pago.
      <br><br>
      Para continuar utilizando el sistema, comunícate con nosotros
      para reactivar tu servicio.
    </p>

    <div class="payment">
      ⚠️ Servicio suspendido
    </div>

    <a
      class="whatsapp"
      href="https://wa.me/50231064872?text=Hola%2C%20quiero%20reactivar%20mi%20sistema."
      target="_blank"
      rel="noopener noreferrer"
    >

  </main>

</body>
</html>
