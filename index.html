<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Acceso suspendido</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  min-height:100%;
  background:#000;
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Arial,sans-serif;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  overflow:hidden;
}

.page{
  width:100%;
  max-width:560px;
  min-height:100vh;
  padding:55px 25px 35px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
}

/* ICONO */

.icon-wrap{
  position:relative;
  width:105px;
  height:105px;
  margin-bottom:34px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.icon-glow{
  position:absolute;
  width:105px;
  height:105px;
  border-radius:50%;
  background:#ff302d;
  filter:blur(35px);
  opacity:.13;
  animation:pulse 3s infinite;
}

.icon{
  position:relative;
  width:92px;
  height:92px;
  border:3px solid #ff3b36;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    0 0 18px rgba(255,59,54,.35),
    inset 0 0 18px rgba(255,59,54,.05);
}

.icon span{
  color:#ff3b36;
  font-size:55px;
  line-height:1;
  font-weight:700;
  transform:translateY(-2px);
}

/* TEXTO */

.status{
  color:#ff403b;
  font-size:13px;
  font-weight:800;
  letter-spacing:4px;
  margin-bottom:14px;
}

h1{
  font-size:clamp(38px,10vw,52px);
  line-height:1.05;
  font-weight:750;
  letter-spacing:-1.5px;
  margin-bottom:22px;
}

.description{
  color:#9d9d9d;
  font-size:17px;
  line-height:1.65;
  max-width:470px;
  margin-bottom:27px;
}

.description strong{
  color:#d7d7d7;
  font-weight:600;
}

/* BADGE */

.badge{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:11px 19px;
  border-radius:50px;
  background:#151515;
  border:1px solid #292929;
  color:#c8c8c8;
  font-size:14px;
  font-weight:500;
  margin-bottom:34px;
  box-shadow:0 4px 20px rgba(0,0,0,.5);
}

.badge-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#ff3b36;
  box-shadow:0 0 10px rgba(255,59,54,.7);
}

/* BOTÓN */

.whatsapp{
  width:100%;
  max-width:500px;
  min-height:70px;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:13px;

  background:#20d866;
  color:#fff;
  text-decoration:none;

  font-size:18px;
  font-weight:750;

  box-shadow:
    0 12px 35px rgba(32,216,102,.17),
    inset 0 1px 0 rgba(255,255,255,.15);

  transition:
    transform .18s ease,
    background .18s ease,
    box-shadow .18s ease;

  position:relative;
  overflow:hidden;
}

.whatsapp::before{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:70%;
  height:100%;
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.13),
    transparent
  );
  transform:skewX(-20deg);
  animation:shine 4s infinite;
}

.whatsapp:active{
  transform:scale(.97);
  background:#1bc75b;
  box-shadow:0 6px 20px rgba(32,216,102,.12);
}

.whatsapp-icon{
  width:28px;
  height:28px;
  fill:white;
  position:relative;
}

/* SOPORTE */

.support{
  margin-top:22px;
  color:#575757;
  font-size:13px;
  line-height:1.5;
}

.support-number{
  display:block;
  color:#777;
  margin-top:4px;
  font-size:13px;
  letter-spacing:.5px;
}

/* ANIMACIONES */

@keyframes pulse{
  0%,100%{
    transform:scale(.9);
    opacity:.10;
  }
  50%{
    transform:scale(1.12);
    opacity:.17;
  }
}

@keyframes shine{
  0%{
    left:-100%;
  }
  25%,100%{
    left:140%;
  }
}

/* CELULARES PEQUEÑOS */

@media(max-height:700px){
  .page{
    padding-top:30px;
    padding-bottom:25px;
  }

  .icon-wrap{
    transform:scale(.82);
    margin-bottom:18px;
  }

  .status{
    margin-bottom:10px;
  }

  h1{
    font-size:38px;
    margin-bottom:15px;
  }

  .description{
    font-size:15px;
    line-height:1.5;
    margin-bottom:20px;
  }

  .badge{
    margin-bottom:22px;
  }

  .whatsapp{
    min-height:62px;
    font-size:16px;
  }
}
</style>
</head>

<body>

</body>
